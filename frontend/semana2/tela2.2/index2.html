<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela 2.2 - Registo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cartao">
        <div class="cabecalho">
            <h1>Cadastro</h1>
            <img src="logo.png" alt="Logo Serra Jr" class="logo">
        </div>
        <div class="conteudo">
            <form id="form-cadastro">
                <div class="campo">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="exemplo@123.com">
                </div>
                <div class="campo">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" placeholder="exemplo123">
                </div>
                <div class="campo">
                    <label for="confirmar-senha">Confirmar Senha:</label>
                    <input type="password" id="confirmar-senha" placeholder="exemplo123">
                </div>
                <button type="submit" id="btn-criar" class="btn">Criar</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
