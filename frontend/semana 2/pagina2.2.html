<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Semana 2: login</title>
		<link href="./login.css" rel="stylesheet">
		<script src="./login.js" defer></script>
		<!-- fonte poppins -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
		<!-- padroniza o css entre navegadores -->
		<link href="https://necolas.github.io/normalize.css/8.0.1/normalize.css" rel="stylesheet">
	</head>
	<body>
		<main>
			<header>
				<span>Cadastro</span>
				<img src="./serra_logo.png" alt="Logo da serra">
			</header>
			<article>
				<label>
					Email: <br><br>
					<input type="text" id="email" placeholder="exemplo@123.com">
				</label>
				<label>
					Senha: <br><br>
					<input type="text" id="passwd" placeholder="exemplo123">
				</label>
				<label>
					Confirmar Senha: <br><br>
					<input type="text" id="confpass" placeholder="exemplo123">
				</label>
				<button id="enter">Criar</button>
			</article>
		</main>
	</body>
</html>
