<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet"  href="style.css"/>

</head>
<body>
    <div id="caixa_grande">
        <div id="laranja">
            <h1>Cadastro</h1>
            <img src="Logo.png" alt="logo Serra" >
        </div>
        <div id="azul">
            <form  onsubmit="criar(event)">
                <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="exemplo123"  ><br> 
                <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="exemplo123" > <br>
                <label for="confirmarsenha">Confirmar senha:</label>
                    <input type="password" id="confirmarsenha" name="confirmarsenha" placeholder="exemplo123">
                    <input type="submit" id="btncriar" value="Criar">
            </form>
            
        </div>
    </div>
    <script src="script.js"></script>
</body>
